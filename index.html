<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a5f" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="منصة التدريب والمحاكاة" />
  <meta name="description" content="منصة عربية للتدريب والمحاكاة على GCAT وPQ10 والسلوكيات المعطلة والحكم القيادي" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preload" href="fonts/plex-arabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/plex-arabic-700-arabic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <title>منصة التدريب والمحاكاة</title>
</head>
<body>
  <a class="skip-link" href="#main">تجاوز إلى المحتوى</a>

  <div id="app" class="app">
    <!-- Desktop / tablet navigation rail -->
    <aside class="rail" aria-label="التنقل الرئيسي">
      <div class="rail-brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="rail-brand-text"><strong>منصة التدريب والمحاكاة</strong><small>تقييم · تدريب · محاكاة</small></span>
      </div>
      <nav class="rail-nav">
        <button class="rail-item" data-nav="home" data-action="home"><span class="rail-ico" data-icon="home"></span><span>الرئيسية</span></button>
        <button class="rail-item" data-nav="simulation" data-action="simulation-home"><span class="rail-ico" data-icon="simulation"></span><span>المحاكاة</span></button>
        <button class="rail-item" data-nav="training" data-action="training-home"><span class="rail-ico" data-icon="training"></span><span>التدريب</span></button>
        <button class="rail-item" data-nav="review" data-action="review-home"><span class="rail-ico" data-icon="review"></span><span>المراجعة</span></button>
        <button class="rail-item" data-nav="results" data-action="results-home"><span class="rail-ico" data-icon="results"></span><span>النتائج</span></button>
        <span class="rail-sep" role="separator"></span>
        <button class="rail-item" data-nav="orientation" data-action="orientation-home"><span class="rail-ico" data-icon="guide"></span><span>قبل أن تبدأ</span></button>
      </nav>
      <div class="rail-foot">
        <button class="rail-tool" data-proxy="fontBtn" aria-label="حجم الخط" title="حجم الخط"><span class="rail-ico" data-icon="text"></span><span>حجم الخط</span></button>
        <button class="rail-tool" data-proxy="themeBtn" aria-label="تبديل المظهر" title="تبديل المظهر"><span class="rail-ico" data-icon="contrast"></span><span>المظهر</span></button>
        <button class="rail-tool" id="railInstall" data-action="install-app" aria-label="تثبيت التطبيق" title="تثبيت التطبيق" hidden><span class="rail-ico" data-icon="download"></span><span>تثبيت التطبيق</span></button>
      </div>
    </aside>

    <div class="frame">
      <header class="topbar">
        <div class="topbar-start">
          <button id="backBtn" class="icon-btn" aria-label="الرجوع إلى الصفحة السابقة" title="رجوع"></button>
          <button id="homeBtn" class="icon-btn only-mobile" aria-label="الصفحة الرئيسية" title="الصفحة الرئيسية"></button>
        </div>
        <div class="topbar-title"><h1 id="pageTitle">منصة التدريب والمحاكاة</h1></div>
        <div class="topbar-end">
          <div id="topbarSlot" class="topbar-slot"></div>
          <button id="fontBtn" class="icon-btn only-mobile" aria-label="حجم الخط" title="حجم الخط">Aa</button>
          <button id="themeBtn" class="icon-btn only-mobile" aria-label="تبديل المظهر" title="تبديل المظهر"></button>
        </div>
      </header>
      <main id="main" class="main" tabindex="-1"></main>
      <footer class="footer">للتدريب والتطوير الذاتي — لا يُستخدم كاختبار معياري أو كقرار توظيف مستقل.</footer>
    </div>
  </div>

  <!-- Phone tab bar -->
  <nav id="mobileNav" class="tabbar" aria-label="التنقل الرئيسي">
    <button class="tab-item" data-nav="home" data-action="home"><span class="tab-ico" data-icon="home"></span><small>الرئيسية</small></button>
    <button class="tab-item" data-nav="simulation" data-action="simulation-home"><span class="tab-ico" data-icon="simulation"></span><small>المحاكاة</small></button>
    <button class="tab-item" data-nav="training" data-action="training-home"><span class="tab-ico" data-icon="training"></span><small>التدريب</small></button>
    <button class="tab-item" data-nav="review" data-action="review-home"><span class="tab-ico" data-icon="review"></span><small>المراجعة</small></button>
    <button class="tab-item" data-nav="results" data-action="results-home"><span class="tab-ico" data-icon="results"></span><small>النتائج</small></button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js" defer></script>
  <script src="ui.js" defer></script>
</body>
</html>
