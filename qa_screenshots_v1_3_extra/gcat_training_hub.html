<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../styles.css"><style>body{padding-bottom:20px}.topbar{position:sticky}.main{max-width:850px}</style><body><header class="topbar"><div class="top-nav-actions"><button class="icon-btn">⌂</button><button class="icon-btn">‹</button></div><div class="title-area"><div class="eyebrow">منصة التدريب والمحاكاة</div><h1>GCAT — التدريب</h1></div><div class="top-actions"><button class="icon-btn">Aa</button></div></header><main class="main"><section class="page-intro gcat-training-head"><span class="section-icon">⌁</span><div><h2>GCAT — التدريب</h2><p>اختر مجال التدريب أو جلسة مختلطة. بعد اختيار المجال ستجد: جميع الأسئلة، جلسة سريعة، أخطائي، المفضلة، وحسب الموضوع.</p></div></section><div class="training-choice-grid"><button class="training-choice-card" data-action="gcat-training-mixed" ><span class="training-choice-icon">✦</span><strong>تدريب مختلط عشوائي</strong><small>42 سؤالًا متوازنًا: 14 عددي + 14 لفظي + 14 تجريدي</small><span class="chev">‹</span></button><button class="training-choice-card" data-action="gcat-domain-hub" data-kind="numerical"><span class="training-choice-icon">123</span><strong>العددي</strong><small>98 سؤالًا متاحًا</small><span class="chev">‹</span></button><button class="training-choice-card" data-action="gcat-domain-hub" data-kind="verbal"><span class="training-choice-icon">Aa</span><strong>اللفظي</strong><small>98 سؤالًا متاحًا</small><span class="chev">‹</span></button><button class="training-choice-card" data-action="gcat-domain-hub" data-kind="abstract"><span class="training-choice-icon">◇</span><strong>التجريدي</strong><small>98 سؤالًا متاحًا</small><span class="chev">‹</span></button><button class="training-choice-card" data-action="gcat-training-sims" ><span class="training-choice-icon">M</span><strong>تدريب حسب المحاكاة</strong><small>اختر M1–M7 إذا أردت حزمة محددة</small><span class="chev">‹</span></button><button class="training-choice-card" data-action="gcat-training-mistakes" ><span class="training-choice-icon">!</span><strong>كل أخطاء GCAT</strong><small>لا توجد أخطاء مفتوحة</small><span class="chev">‹</span></button><button class="training-choice-card" data-action="gcat-training-favorites" ><span class="training-choice-icon">★</span><strong>كل المفضلة</strong><small>لم تحفظ أسئلة بعد</small><span class="chev">‹</span></button></div><button class="quick-review-card" data-action="quick-review"><span>⚡</span><div><strong>مراجعة سريعة قبل الامتحان</strong><small>أهم قواعد GCAT في 1–2 دقيقة</small></div><span class="chev">‹</span></button></main></body></html>
