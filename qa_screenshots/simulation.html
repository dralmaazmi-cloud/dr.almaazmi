<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../styles.css"></head><body><div class="app-shell"><header class="topbar"><div class="top-nav-actions"><button class="icon-btn">⌂</button><button class="icon-btn">‹</button></div><div class="title-area"><div class="eyebrow">منصة التدريب والمحاكاة</div><h1>simulation</h1></div><div class="top-actions"><button class="icon-btn">Aa</button><button class="icon-btn">◐</button></div></header><main class="main"><section class="simulation-hero"><span class="sim-big-icon">☷</span><div><h2>المحاكاة الشاملة 1</h2><span class="status-chip">جاهزة</span><p>اختر الوضع الذي يناسبك وابدأ الآن.</p></div></section>
  <div class="mode-card-grid four-modes">
    <button class="mode-card" data-action="section-picker" data-sim="M1" data-mode="training"><span class="mode-icon">✎</span><strong>وضع التدريب</strong><small>تصحيح وشرح فوري بعد الإجابة</small></button>
    <button class="mode-card" data-action="section-picker" data-sim="M1" data-mode="exam"><span class="mode-icon">☷</span><strong>وضع الامتحان</strong><small>بدون تلميحات أو تصحيح أثناء الحل</small></button>

    <button class="mode-card" data-action="section-picker" data-sim="M1" data-mode="both"><span class="mode-icon">▥</span><strong>محاكاة قسم واحد</strong><small>اختر قسمًا واحدًا للتدريب أو الاختبار</small></button>
  </div>
