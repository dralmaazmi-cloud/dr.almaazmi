<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../styles.css"></head><body><div class="app-shell"><header class="topbar"><div class="top-nav-actions"><button class="icon-btn">⌂</button><button class="icon-btn">‹</button></div><div class="title-area"><div class="eyebrow">منصة التدريب والمحاكاة</div><h1>gcat_training</h1></div><div class="top-actions"><button class="icon-btn">Aa</button><button class="icon-btn">◐</button></div></header><main class="main"><section class="page-intro gcat-training-head"><span class="section-icon">⌁</span><div><h2>GCAT — التدريب</h2><p>اختر نوع التدريب الذي تريده. التدريب غير موقّت ويعرض التصحيح والشرح بعد إجابتك.</p></div></section><div class="training-choice-grid">
  <button class="training-choice-card" data-action="gcat-training-mixed" ><span class="training-choice-icon">✦</span><strong>تدريب مختلط عشوائي</strong><small>42 سؤالًا متوازنًا: 14 عددي + 14 لفظي + 14 تجريدي</small><span class="chev">‹</span></button>
  <button class="training-choice-card" data-action="gcat-training-domain" data-kind="numerical"><span class="training-choice-icon">123</span><strong>العددي فقط</strong><small>14 سؤالًا عشوائيًا من أصل 98</small><span class="chev">‹</span></button>
  <button class="training-choice-card" data-action="gcat-training-domain" data-kind="verbal"><span class="training-choice-icon">Aa</span><strong>اللفظي فقط</strong><small>14 سؤالًا عشوائيًا من أصل 98</small><span class="chev">‹</span></button>
  <button class="training-choice-card" data-action="gcat-training-domain" data-kind="abstract"><span class="training-choice-icon">◇</span><strong>التجريدي فقط</strong><small>14 سؤالًا عشوائيًا من أصل 98</small><span class="chev">‹</span></button>
  <button class="training-choice-card" data-action="gcat-training-topics" ><span class="training-choice-icon">☷</span><strong>تدريب حسب الموضوع</strong><small>اختر المتتاليات أو النسب أو المرادفات أو الدوران وغيرها</small><span class="chev">‹</span></button>
  <button class="training-choice-card" data-action="gcat-training-sims" ><span class="training-choice-icon">M</span><strong>تدريب حسب المحاكاة</strong><small>اختر M1–M7 إذا أردت التدريب على حزمة محددة</small><span class="chev">‹</span></button>
  <button class="training-choice-card" data-action="gcat-training-mistakes" ><span class="training-choice-icon">!</span><strong>أخطائي فقط</strong><small>لا توجد أخطاء مفتوحة حاليًا</small><span class="chev">‹</span></button>
  <button class="training-choice-card" data-action="gcat-training-favorites" ><span class="training-choice-icon">★</span><strong>المفضلة</strong><small>لم تحفظ أسئلة GCAT بعد</small><span class="chev">‹</span></button>
  </div><button class="quick-review-card" data-action="quick-review"><span>⚡</span><div><strong>مراجعة سريعة قبل الامتحان</strong><small>أهم قواعد GCAT في 1–2 دقيقة</small></div><span class="chev">‹</span></button></main></div></body></html>
